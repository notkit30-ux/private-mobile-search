version: "3.9"

services:
  meilisearch:
    image: getmeili/meilisearch:v1.10
    container_name: private-search-meilisearch
    ports:
      - "7700:7700"
    environment:
      MEILI_ENV: development
      MEILI_MASTER_KEY: change-me
    volumes:
      - meili_data:/meili_data

  api:
    build:
      context: ./backend
    container_name: private-search-api
    ports:
      - "8000:8000"
    environment:
      MEILI_HOST: http://meilisearch:7700
      MEILI_MASTER_KEY: change-me
      API_KEY: change-me
    depends_on:
      - meilisearch

volumes:
  meili_data:
